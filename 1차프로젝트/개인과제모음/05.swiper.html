
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }

    body {
      background: #000;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .swiper {
      width: 100%;
      height: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .swiper-slide {
      text-align: center;
      font-size: 18px;
      background: #333;
      height: calc((100% - 30px) / 2) !important;

      /* Center slide text vertically */
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="./피자리스트/피자1누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자2누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자3누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자4누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자5누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자6누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자7누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자8누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자9누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자10누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자11누끼.png" alt=""></div>
      <div class="swiper-slide"><img src="./피자리스트/피자12누끼.png" alt=""></div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    var swiper2 = new Swiper(".mySwiper", {
      slidesPerView: 2,
      grid: {
        rows: 2,
      },
      spaceBetween: 30,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
    });
  </script>
</body>

</html>
