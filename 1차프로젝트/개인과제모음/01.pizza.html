<!DOCTYPE html>

    <div id="top-area">

    <div class="r-pizza-menu">

    <!-- 3.로고영역 -->
    <div class="logo-area">
        <ul>
<li><a href="#"><img src="./로고/demo-pizza-parlor-home-icon-01.png" alt="안뜯은피자"></a></li>
<li><a href="#"><img src="./로고/안뜯은치킨.png" alt="안뜯은치킨2"></a></li>
<li><a href="#"><img src="./로고/demo-pizza-parlor-home-icon-05.png" alt="안뜯은콜라"></a></li>

<li><a href="#"><img src="./로고/RSPZ1661_pb.png" alt="하프앤하프"></a></li>

      <img src="./904.개인과제피자헛/배너/피자헛7.png" alt="동영상배너" class="m-banner">

    <div class="event-part inbox"></div>

  <!-- 7.하단영역 -->
